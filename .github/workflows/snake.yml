name: Contribution snake

# Redraws the snake that eats your contribution graph.
# Runs daily, on every push to main, and can be run by hand from the Actions tab.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF8121&color_dots=#161B22,#4A2A12,#8A4210,#C95D0C,#FF8121
            dist/snake-light.svg?color_snake=#E8670A&color_dots=#EBEDF0,#FFD7B0,#FFAE66,#F58A2E,#E8670A

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
