<radialGradient id="glow" cx="0.82" cy="0.15" r="0.65"><stop offset="0" stop-color="#FF8121" stop-opacity="0.22"/><stop offset="1" stop-color="#FF8121" stop-opacity="0"/></radialGradient>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#121110" stop-opacity="1"/><stop offset="0.45" stop-color="#121110" stop-opacity="0.6"/><stop offset="1" stop-color="#121110" stop-opacity="0"/></linearGradient>
<style>
      .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; } .d4 { animation-delay: .85s; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    </style>
